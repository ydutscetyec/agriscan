name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend (${{ matrix.label }})
    runs-on: ubuntu-latest

    # The backend suite runs against a real MariaDB, not SQLite. The immutability
    # trigger and the DATETIME semantics are MariaDB features; proving them on
    # SQLite would prove nothing.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: agriscan-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        include:
          # A UTC-only run is how the p38 capture-session bug stayed hidden: every
          # session expired the instant it was created at UTC+8, and the container
          # clock was UTC so nothing failed. The second row is the guard.
          - label: UTC
            tz: UTC
            db_tz: "+00:00"
          - label: offset clocks
            tz: Asia/Manila
            db_tz: "+08:00"

    env:
      AGRISCAN_DB_HOST: 127.0.0.1
      AGRISCAN_DB_PORT: 3306
      AGRISCAN_DB_USER: root
      AGRISCAN_DB_PASSWORD: agriscan-ci
      AGRISCAN_SECRET_KEY: ci-secret-not-for-production-0123456789abcdef
      TZ: ${{ matrix.tz }}
      AGRISCAN_TEST_DB_TZ: ${{ matrix.db_tz }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Printed so a failure is diagnosable at a glance. Uses pymysql rather than
      # a mariadb client binary, which the runner image does not ship.
      - name: Show both clocks
        working-directory: backend
        run: |
          python - <<'PY'
          import datetime as dt, os, pymysql
          print("application:", dt.datetime.now(dt.timezone.utc).replace(tzinfo=None), "UTC")
          conn = pymysql.connect(
              host=os.environ["AGRISCAN_DB_HOST"],
              port=int(os.environ["AGRISCAN_DB_PORT"]),
              user=os.environ["AGRISCAN_DB_USER"],
              password=os.environ["AGRISCAN_DB_PASSWORD"],
          )
          with conn.cursor() as cur:
              cur.execute("SELECT NOW(), @@global.time_zone, @@system_time_zone")
              now, global_tz, system_tz = cur.fetchone()
          print("db server  :", now, f"(global={global_tz}, system={system_tz})")
          PY

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test

      # A build failure is as breaking as a test failure — serve.py serves
      # web/dist, so a broken build means the site does not come up at all.
      - name: Build
        working-directory: web
        run: npm run build
